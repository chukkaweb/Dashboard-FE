<div class="landing-page">
  <!-- Header -->
  <header class="header container-fluid px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
    <div class="logo d-flex align-items-center gap-2">
      <img
        src="https://placehold.co/40x40/0d6efd/FFFFFF?text=T"
        alt="Trafalgar Logo"
        class="logo-icon"
      />
      <span class="logo-text fw-bold text-primary fs-4">Trafalgar</span>
    </div>

    <nav>
      <ul class="nav">
        <li class="nav-item">
          <a
            class="btn btn-outline-primary px-4 py-2 fw-medium"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
          >
            Login
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="hero container d-flex flex-wrap align-items-center justify-content-between py-5">
    <div class="hero-text flex-fill text-center text-md-start pe-md-4">
      <h1 class="display-4 fw-bold mb-3 text-dark">Virtual healthcare for you</h1>
      <p class="lead text-secondary mb-4">
        Trafalgar provides progressive and affordable healthcare, accessible
        online and on mobile for everyone.
      </p>
      <button class="btn btn-primary btn-lg px-4 py-2">Learn More</button>
    </div>

    <div class="hero-image flex-fill text-center mt-4 mt-md-0">
      <img
        src="https://placehold.co/600x400/D3D3D3/000000?text=Healthcare+Illustration"
        alt="Healthcare Illustration"
        class="img-fluid rounded shadow"
      />
    </div>
  </main>

  <!-- Login Modal -->
  <div
    class="modal fade"
    id="loginModal"
    tabindex="-1"
    aria-labelledby="loginModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold text-primary" id="loginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body px-4 pb-4">
          <app-login></app-login>
        </div>
      </div>
    </div>
  </div>
</div>
