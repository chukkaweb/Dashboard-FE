
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Step 1: Mobile Number -->
          <div *ngIf="currentStep === 1">
            <div class="mb-3">
              <label class="form-label">Mobile Number</label>
              <input formControlName="mobile" type="text" class="form-control" maxlength="10" placeholder="Enter mobile number" />
              <div *ngIf="mobile.invalid && (mobile.dirty || mobile.touched)" class="text-danger mt-1">
                <small *ngIf="mobile.errors?.['required']">Mobile number is required.</small>
                <small *ngIf="mobile.errors?.['pattern']">Enter a valid 10-digit number.</small>
              </div>
            </div>
            <button class="btn btn-primary w-100" [disabled]="loginForm.invalid">Send OTP</button>
          </div>

          <!-- Step 2: OTP Verification -->
          <div *ngIf="currentStep === 2">
            <div class="mb-3">
              <label class="form-label">Enter OTP</label>
              <input formControlName="otp" type="text" class="form-control" maxlength="6" placeholder="Enter OTP" />
              <div *ngIf="otp.invalid && (otp.dirty || otp.touched)" class="text-danger mt-1">
                <small *ngIf="otp.errors?.['required']">OTP is required.</small>
                <small *ngIf="otp.errors?.['pattern']">Enter a valid 6-digit OTP.</small>
              </div>
            </div>

            <div class="d-flex justify-content-between">
              <button class="btn btn-secondary" type="button" (click)="resendOtp()">Resend OTP</button>
              <button class="btn btn-success" [disabled]="otp?.invalid">Verify OTP</button>
            </div>
          </div>

        </form>
