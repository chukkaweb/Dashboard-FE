<div class="table-responsive">
  <table class="table table-hover table-striped align-middle mb-0 border">
    <thead class="table-light text-center text-nowrap">
      <tr>
        <th>
        </th>
        <th class="text-start">User</th>
        <th>Country</th>
        <th class="text-start">Usage</th>
        <th>Payment</th>
        <th class="text-start">Activity</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users; let i = index">
        <!-- Avatar -->
        <td class="text-center">
          
        </td>

        <!-- User Info -->
        <td>
          <div>{{ user.name }}</div>
          <div class="small text-muted text-nowrap">
            {{ user.state }} | Registered: {{ user.registered }}
          </div>
        </td>

        <!-- Country -->
        <td class="text-center">
          
        </td>

        <!-- Usage -->
        <td>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <strong>{{ user.usage }}%</strong>
            <small class="text-muted">{{ user.period }}</small>
          </div>
         
        </td>

        <!-- Payment -->
        <td class="text-center">
          
        </td>

        <!-- Activity -->
        <td>
          <div class="small text-muted">Last login</div>
          <div class="fw-semibold">{{ user.activity }}</div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
