<nav id="sidebar"
  class="sidebar border-end bg-dark text-white d-flex flex-column vh-100 position-fixed"
  [ngClass]="{ 'collapsed': isCollapsed }">

  <!-- Sidebar Header / Brand -->
  <div class="sidebar-header border-bottom d-flex align-items-center justify-content-between p-3">
    <a routerLink="/" class="text-decoration-none text-white fw-bold fs-5">
      <i class="bi bi-bootstrap-fill me-2"></i> MyApp
    </a>
    <button class="btn btn-sm btn-outline-light d-lg-none"
            type="button"
            (click)="toggleSidebar()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Sidebar Navigation -->
  <div class="flex-grow-1 overflow-auto">
    <ul class="nav flex-column p-2">
      <li class="nav-item" *ngFor="let item of navItems">
        <a class="nav-link text-white d-flex align-items-center gap-2"
           [routerLink]="item.path"
           routerLinkActive="active">
          <i class="bi" [ngClass]="item.icon"></i>
          <span *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Sidebar Footer -->
  <div class="border-top p-3 d-none d-lg-flex justify-content-center" style="cursor:pointer;">
    <button class="btn btn-outline-light btn-sm"
            (click)="toggleSidebar()"
            aria-label="Toggle sidebar">
      <i class="bi" [ngClass]="{ 'bi-arrow-bar-left': !isCollapsed, 'bi-arrow-bar-right': isCollapsed }"></i>
    </button>
  </div>
</nav>
